<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>DoughLoops — in-browser step sequencer</title>
        <meta
            name="description"
            content="A free in-browser drum machine and step sequencer. Build beats in any time signature, tweak the kit, and play them back instantly — no install, no sign-up."
        />
        <meta name="theme-color" content="#16161e" />
        <meta name="color-scheme" content="dark" />

        <link rel="icon" type="image/png" sizes="64x64" href="/src/assets/favicon-64.png" />
        <link rel="apple-touch-icon" href="/src/assets/favicon-180.png" />

        <link rel="canonical" href="https://doughloops.evanczako.com/" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="DoughLoops" />
        <meta property="og:title" content="DoughLoops — in-browser step sequencer" />
        <meta
            property="og:description"
            content="A free in-browser drum machine and step sequencer. Build beats in any time signature and play them back instantly."
        />
        <meta property="og:url" content="https://doughloops.evanczako.com/" />
        <!--
            Absolute, and pointing at public/og.png rather than a favicon. Both
            matter: a scraper has no base URL to resolve a relative path
            against, so the old /src/assets/... value produced no preview at
            all; and og.png is the 1200x630 card platforms actually lay out.
            public/ is copied verbatim by Vite, so this path survives the build
            unhashed -- a /src/assets/ reference would not.
        -->
        <meta property="og:image" content="https://doughloops.evanczako.com/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="DoughLoops — in-browser step sequencer. A four-track drum pattern on a sixteen-step grid."
        />
        <meta name="twitter:card" content="summary_large_image" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <!--
            Cloudflare Web Analytics for doughloops.evanczako.com. Each of the four sites has its
            own token, so each gets its own dashboard rather than all four
            blurring into one number.

            No cookies, no localStorage, no fingerprinting, so this needs no
            consent banner. The token is not a secret -- it ships in the page
            source by design.

            There are no click events: Cloudflare Web Analytics has no track()
            call. The hub-to-app funnel is read from the referrer on the app's
            own dashboard instead. See phase 5 in the hub's PLAN.md.
        -->
        <script
            type="module"
            src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "65d8e7e8eecd41a7b10ef64a04a143b9"}'
        ></script>
    </body>
</html>
